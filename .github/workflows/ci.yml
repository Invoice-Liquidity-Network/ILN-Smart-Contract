name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings -A deprecated

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run workspace unit tests
        run: cargo test --workspace --lib

      - name: Run workspace integration tests
        run: cargo test --workspace --tests --all

      - name: Run fuzz test suite
        run: cargo test -p iln_fuzz

  coverage:
    name: Code Coverage Gate (≥95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run coverage check (blocking gate, fail under 90%)
        # Note: continue-on-error is intentionally omitted to make coverage regressions strictly blocking.
        # --include-files scopes the *report* to invoice_liquidity's src tree; -p only limits
        # which packages are built/run, while tarpaulin would otherwise count uncovered lines
        # from sibling workspace crates (iln_governance, insurance_pool) and test mocks against us.
        # Test-only modules are excluded so the gate measures production code.
        run: cargo tarpaulin -p invoice_liquidity --timeout 300 --fail-under 90 --out xml --include-files 'contracts/invoice_liquidity/src/*' --exclude-files 'contracts/invoice_liquidity/src/tests_*' 'contracts/invoice_liquidity/src/test.rs'

