[graph]
targets = [
  "wasm32-unknown-unknown",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # paste is unmaintained (RUSTSEC-2024-0436); pulled in transitively via
  # soroban-wasmi, no upgrade available. Not a vulnerability.
  "RUSTSEC-2024-0436",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]
skip = [
  { name = "darling", version = "=0.20.11" },
  { name = "darling_core", version = "=0.20.11" },
  { name = "darling_macro", version = "=0.20.11" },
  # The following are duplicated inside the soroban-sdk dependency tree and
  # cannot be deduplicated from here — the older version in each pair is
  # pinned by a transitive dependency we do not control.
  { name = "syn", version = "=2.0.117" },
  { name = "stellar-strkey", version = "=0.0.13" },
  { name = "hashbrown", version = "=0.12.3" },
  { name = "hashbrown", version = "=0.15.5" },
  { name = "crate-git-revision", version = "=0.0.6" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
